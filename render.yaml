# Render Blueprint — деплоит только backend/ как Node Web Service (free plan).
# Документация: https://render.com/docs/blueprint-spec
#
# ВАЖНО: имя сервиса определяет публичный URL: https://<name>.onrender.com
# Если "ai-survey-backend" уже занято на Render, смени name здесь И
# destination в frontend/vercel.json на новое значение.

services:
  # Name must match the live service — its public URL is https://<name>.onrender.com
  # (currently https://ai-survey-backend-3g62.onrender.com). Changing the name
  # here would make a Blueprint sync create a SECOND service, not update this one.
  - type: web
    name: ai-survey-backend-3g62
    runtime: node
    # SINGLE-INSTANCE INVARIANT — do not scale to >1 instance. Sessions live in
    # an in-memory Map (Redis is only a durability mirror, re-read on boot), and
    # the single-flight lock + rate-limit counters are process-local. The free
    # plan runs exactly one instance; on a paid plan, do NOT raise the instance
    # count without first moving sessions/locks to a shared store, or requests
    # will 404 sessions across processes. The app also logs a loud warning at
    # boot if WEB_CONCURRENCY > 1.
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      # Render fronts the app with one reverse-proxy hop; trust it so
      # express-rate-limit keys on the real client IP, not the proxy's.
      - key: TRUST_PROXY
        value: "1"
      # Домен фронтенда на Vercel — должен совпадать с project name,
      # который используется при деплое фронта (см. DEPLOY.md).
      - key: CORS_ORIGIN
        value: https://ai-survey-frontend-bay.vercel.app
      # Секрет — задаётся вручную в Render Dashboard (или через `render env set`),
      # никогда не коммитится. Без ключа приложение всё равно работает
      # (детерминированные fallback-ответы вместо реального OpenAI).
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      # Durable sessions via Upstash Redis (optional). Set both in the Render
      # Dashboard; without them the app keeps sessions in memory and loses them
      # on restart / idle-sleep. Secrets, so never committed.
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      # MarkItDown is OPTIONAL: this node runtime has no Python, so the backend
      # serves pdf/docx/txt/html via its built-in parsers and hides .pptx from
      # the UI. To enable full MarkItDown support, switch the service to a
      # Docker runtime and set MARKITDOWN_BIN to the installed binary.
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_GLOBAL_MAX
        value: "300"
      - key: RATE_LIMIT_AI_MAX
        value: "30"
