name: CI v2 (path-first)

on:
  push:
    branches: [main]
    paths: ["v2/**", ".github/workflows/ci-v2.yml"]
  pull_request:
    paths: ["v2/**", ".github/workflows/ci-v2.yml"]

jobs:
  v2-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: v2/backend/package-lock.json
      - run: npm ci
        working-directory: v2/backend
      - run: npm test
        working-directory: v2/backend

  v2-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: v2/frontend/package-lock.json
      - run: npm ci
        working-directory: v2/frontend
      - run: npm run lint
        working-directory: v2/frontend
      - run: npm test
        working-directory: v2/frontend
      - run: npm run build
        working-directory: v2/frontend
